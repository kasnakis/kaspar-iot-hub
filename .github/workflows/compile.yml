name: Compile firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/compile.yml"]
  pull_request:
    paths: ["firmware/**"]
  workflow_dispatch:

jobs:
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ArduinoJson@7" "MQTT@2.5"
      - name: Compile (ESP32-S3)
        run: arduino-cli compile --fqbn esp32:esp32:esp32s3 firmware/KasparIoT_Universal_ESP32

  mkr1310:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install SAMD core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:samd
          arduino-cli lib install "MKRWAN" "FlashStorage"
      - name: Compile (MKR WAN 1310)
        run: arduino-cli compile --fqbn arduino:samd:mkrwan1310 firmware/KasparIoT_Universal_MKR1310
